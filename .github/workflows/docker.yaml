name: Mirror Docker images

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Optional single image to test, for example hello-world:linux"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - images.txt

permissions:
  contents: read

concurrency:
  group: mirror-images-${{ github.ref }}
  cancel-in-progress: false

env:
  ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
  ALIYUN_NAME_SPACE: ${{ secrets.ALIYUN_NAME_SPACE }}
  ALIYUN_REGISTRY_USER: ${{ secrets.ALIYUN_REGISTRY_USER }}
  ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

jobs:
  mirror:
    name: Pull and push
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash

    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          root-reserve-mb: 2048
          swap-size-mb: 128
          remove-dotnet: "true"
          remove-haskell: "true"
          build-mount-path: /var/lib/docker/

      - name: Restart Docker
        run: sudo service docker restart

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare image list
        env:
          MANUAL_IMAGE: ${{ inputs.image }}
        run: |
          set -Eeuo pipefail
          if [[ -n "${MANUAL_IMAGE:-}" ]]; then
            printf '%s\n' "$MANUAL_IMAGE" > "$RUNNER_TEMP/images-to-sync.txt"
          else
            cp images.txt "$RUNNER_TEMP/images-to-sync.txt"
          fi

      - name: Validate Aliyun credentials
        run: |
          set -Eeuo pipefail
          for variable_name in \
            ALIYUN_REGISTRY \
            ALIYUN_NAME_SPACE \
            ALIYUN_REGISTRY_USER \
            ALIYUN_REGISTRY_PASSWORD; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "::error::Required secret $variable_name is not configured"
              exit 1
            fi
          done

          if [[ "$ALIYUN_REGISTRY" == *'/'* || "$ALIYUN_REGISTRY" == http* ]]; then
            echo "::error::ALIYUN_REGISTRY must contain only the registry hostname"
            exit 1
          fi

      - name: Log in to Aliyun Registry
        run: |
          set -Eeuo pipefail
          printf '%s' "$ALIYUN_REGISTRY_PASSWORD" |
            docker login \
              --username "$ALIYUN_REGISTRY_USER" \
              --password-stdin \
              "$ALIYUN_REGISTRY"

      - name: Mirror images
        run: |
          set -Eeuo pipefail

          trim_line() {
            local value="$1"
            value="${value%$'\r'}"
            value="${value#"${value%%[![:space:]]*}"}"
            value="${value%"${value##*[![:space:]]}"}"
            printf '%s' "$value"
          }

          parse_entry() {
            local entry="$1"
            local -a fields
            read -r -a fields <<< "$entry"

            platform=""
            source_image=""

            case "${#fields[@]}" in
              1)
                source_image="${fields[0]}"
                ;;
              2)
                if [[ "${fields[0]}" == --platform=* ]]; then
                  platform="${fields[0]#--platform=}"
                  source_image="${fields[1]}"
                else
                  echo "::error::Unsupported image entry: $entry"
                  return 1
                fi
                ;;
              3)
                if [[ "${fields[0]}" == --platform ]]; then
                  platform="${fields[1]}"
                  source_image="${fields[2]}"
                else
                  echo "::error::Unsupported image entry: $entry"
                  return 1
                fi
                ;;
              *)
                echo "::error::Unsupported image entry: $entry"
                return 1
                ;;
            esac

            if [[ -z "$source_image" || "$source_image" == -* ]]; then
              echo "::error::Invalid source image in entry: $entry"
              return 1
            fi

            if [[ ! "$source_image" =~ ^[A-Za-z0-9._:-]+(/[A-Za-z0-9._-]+)*(:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127})?(@sha256:[A-Fa-f0-9]{64})?$ ]]; then
              echo "::error::Invalid source image in entry: $entry"
              return 1
            fi

            if [[ -n "$platform" && ! "$platform" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)?$ ]]; then
              echo "::error::Invalid platform in entry: $entry"
              return 1
            fi
          }

          image_parts() {
            local image_without_digest="${source_image%%@*}"
            local path_without_tag
            local -a path_parts

            image_name_tag="${image_without_digest##*/}"
            image_name="${image_name_tag%%:*}"
            path_without_tag="${image_without_digest%/*}"
            source_namespace=""

            if [[ "$path_without_tag" != "$image_without_digest" ]]; then
              IFS='/' read -r -a path_parts <<< "$path_without_tag"
              source_namespace="${path_parts[${#path_parts[@]} - 1]}"
            fi
          }

          declare -A first_namespace_by_name=()
          declare -A duplicate_names=()
          image_count=0

          while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
            line="$(trim_line "$raw_line")"
            [[ -z "$line" || "$line" == \#* ]] && continue

            parse_entry "$line"
            image_parts
            ((image_count += 1))

            if [[ -n "${first_namespace_by_name[$image_name]+configured}" ]]; then
              if [[ "${first_namespace_by_name[$image_name]}" != "$source_namespace" ]]; then
                duplicate_names[$image_name]=true
              fi
            else
              first_namespace_by_name[$image_name]="$source_namespace"
            fi
          done < "$RUNNER_TEMP/images-to-sync.txt"

          if ((image_count == 0)); then
            echo "::error::No images were configured"
            exit 1
          fi

          trap 'docker logout "$ALIYUN_REGISTRY" >/dev/null 2>&1 || true' EXIT

          while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
            line="$(trim_line "$raw_line")"
            [[ -z "$line" || "$line" == \#* ]] && continue

            parse_entry "$line"
            image_parts

            pull_arguments=()
            platform_prefix=""
            if [[ -n "$platform" ]]; then
              pull_arguments+=(--platform "$platform")
              platform_prefix="${platform//\//_}_"
            fi
            pull_arguments+=("$source_image")

            namespace_prefix=""
            if [[ -n "${duplicate_names[$image_name]+configured}" && -n "$source_namespace" ]]; then
              namespace_prefix="${source_namespace}_"
            fi

            image_name_tag="${image_name_tag%%@*}"
            target_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$namespace_prefix$image_name_tag"

            echo "Pulling $source_image"
            docker pull "${pull_arguments[@]}"
            echo "Pushing $target_image"
            docker tag "$source_image" "$target_image"
            docker push "$target_image"
            docker image rm "$source_image" "$target_image"
          done < "$RUNNER_TEMP/images-to-sync.txt"
